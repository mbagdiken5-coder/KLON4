<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aşk Hafıza Oyunu</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-love">
    <header class="header">
      <div class="brand">
        <span class="brand__heart">💘</span>
        <div>
          <h1 class="brand__title">Aşk Hafıza</h1>
          <p class="brand__subtitle">Kartları eşle, aşkı bul!</p>
        </div>
      </div>

      <div class="controls">
        <button id="themeBtn" class="btn" type="button">Tema</button>
        <button id="restartBtn" class="btn" type="button">Yeniden</button>
        <a href="/legacy/index.html" class="btn btn--ghost" target="_blank">Legacy</a>
      </div>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat__label">Hamle</div>
        <div id="moves" class="stat__value">0</div>
      </div>
      <div class="stat">
        <div class="stat__label">Süre</div>
        <div id="timer" class="stat__value">00:00</div>
      </div>
      <div class="stat">
        <div class="stat__label">En İyi</div>
        <div id="best" class="stat__value">—</div>
      </div>
    </section>

    <main class="board" id="board" aria-label="Oyun tahtası"></main>

    <div class="overlay hidden" id="overlay">
      <div class="overlay__card">
        <h2 class="overlay__title" id="overlayTitle">Tebrikler!</h2>
        <p class="overlay__text" id="overlayText">Tüm kartları eşleştirdin.</p>
        <button class="btn btn--large" id="playAgainBtn" type="button">Tekrar</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
